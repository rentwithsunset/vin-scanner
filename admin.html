<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Save Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#0f172a;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:14px}h1,h2{margin-top:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}.tabs button{background:#0f172a;color:#fff}.btn.blue{background:#2563eb;color:#fff}.btn.green{background:#15803d;color:#fff}.btn.red{background:#b91c1c;color:#fff}.btn.gray{background:#e2e8f0;color:#0f172a}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result,.batch{border:1px solid #cbd5e1;border-radius:10px;padding:14px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;font-weight:700;border:1px solid #94a3b8;border-radius:5px;padding:4px 7px}.small{color:#64748b;font-size:13px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.status{padding:10px;border-radius:8px;margin-bottom:12px;display:none}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary>div{background:#f8fafc;border-radius:9px;padding:12px}.summary strong{font-size:20px}.batchgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.batchgrid span{display:block;color:#64748b;font-size:12px}.editbox label{display:block;margin:10px 0 5px;font-weight:700}@media(max-width:650px){.grid2,.batchgrid,.actions{grid-template-columns:1fr}.row{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>U-Save Admin</h1>
    <div class="tabs">
      <button onclick="showView('invoices')">INVOICE LOOKUP</button>
      <button onclick="showView('batches')">BILLING BATCHES</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="invoiceView" class="card">
    <h2>Invoice Lookup</h2>
    <div class="small">Search by invoice #, VIN, license plate, or unit #.</div>
    <div class="row" style="margin-top:12px">
      <input id="invoiceSearch" placeholder="Invoice, VIN, plate, or unit #">
      <button class="btn blue" onclick="searchInvoices()">SEARCH</button>
    </div>
    <div id="invoiceResults"></div>
  </div>

  <div id="batchView" class="card hidden">
    <h2>Billing Batches</h2>
    <div id="billingSummary" class="summary"></div>

    <div class="grid2" style="margin-top:14px">
      <div><label>Period Start</label><input id="batchStart" type="date"></div>
      <div><label>Period End</label><input id="batchEnd" type="date"></div>
    </div>
    <button class="btn blue" style="width:100%;margin-top:10px" onclick="createBatch()">CREATE BATCH</button>

    <div id="batchResults" style="margin-top:16px"></div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxe8iGhBAEjjLeyWEj_ws2-oEAlol9qmylOaL_WbLFRC3lr1iNsNiQ21JOPzM90106y/exec";
const pending={};

window.addEventListener("message",function(event){
  const d=event.data;
  if(!d||d.source!=="usave-apps-script-bridge"||!d.requestId)return;
  const p=pending[d.requestId];
  if(!p)return;
  clearTimeout(p.timer);
  if(p.iframe&&p.iframe.parentNode)p.iframe.parentNode.removeChild(p.iframe);
  delete pending[d.requestId];
  p.resolve(d.payload||{success:false,error:"Empty response."});
});

function api(op,params,timeoutMs){
  return new Promise(function(resolve){
    const id="adm_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const f=document.createElement("iframe");
    f.style.display="none";
    const q=new URLSearchParams();
    q.set("action","bridge");q.set("op",op);q.set("requestId",id);q.set("_",Date.now());
    Object.keys(params||{}).forEach(k=>q.set(k,params[k]??""));
    const timer=setTimeout(function(){
      if(f.parentNode)f.parentNode.removeChild(f);
      delete pending[id];
      resolve({success:false,error:"Service request timed out."});
    },timeoutMs||30000);
    pending[id]={iframe:f,timer:timer,resolve:resolve};
    f.src=API_URL+"?"+q.toString();
    document.body.appendChild(f);
  });
}

function money(n){return "$"+Number(n||0).toFixed(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setStatus(msg,error){const e=document.getElementById("status");e.textContent=msg||"";e.className="status "+(error?"err":"ok")}
function showView(v){
  document.getElementById("invoiceView").classList.toggle("hidden",v!=="invoices");
  document.getElementById("batchView").classList.toggle("hidden",v!=="batches");
  history.replaceState(null,"","?view="+v);
  if(v==="batches")loadBatches();
}

async function init(){
  const r=await api("billinginit",{},30000);
  if(!r.success){setStatus(r.error||"Could not initialize billing.",true);return}
  const end=new Date(), start=new Date(); start.setDate(end.getDate()-13);
  document.getElementById("batchEnd").value=end.toISOString().slice(0,10);
  document.getElementById("batchStart").value=start.toISOString().slice(0,10);
  const view=new URLSearchParams(location.search).get("view")==="batches"?"batches":"invoices";
  showView(view);
}
init();

async function searchInvoices(){
  const q=document.getElementById("invoiceSearch").value.trim();
  if(!q){setStatus("Enter an invoice #, VIN, plate, or unit number.",true);return}
  setStatus("Searching...");
  const r=await api("invoicelookup",{query:q});
  if(!r.success){setStatus(r.error||"Search failed.",true);return}
  setStatus(r.invoices.length+" invoice(s) found.");
  const box=document.getElementById("invoiceResults");
  if(!r.invoices.length){box.innerHTML='<div class="result small">No matching invoices.</div>';return}
  box.innerHTML=r.invoices.map(inv=>`
    <div class="result">
      <div class="top"><strong>${esc(inv.invoice)}</strong><span class="badge">${esc(inv.paymentStatus)}</span></div>
      <div style="font-weight:700;margin-top:7px">${esc([inv.year,inv.make,inv.model].filter(Boolean).join(" "))}</div>
      <div class="small">${esc(inv.date)} • Plate ${esc(inv.plate||"—")} • Unit ${esc(inv.unitNumber||"—")} • ${esc(Number(inv.mileage||0).toLocaleString())} mi</div>
      ${inv.billingBatch?`<div class="small">Batch: ${esc(inv.billingBatch)}</div>`:""}
      <div class="actions">
        <button class="btn gray" onclick="window.open(API_URL+'?action=invoice&invoice='+encodeURIComponent('${esc(inv.invoice)}'),'_blank')">VIEW INVOICE</button>
        <button class="btn blue" onclick="editInvoice('${esc(inv.invoice)}')">EDIT / PAYMENT</button>
      </div>
      <div id="edit_${esc(inv.invoice)}"></div>
    </div>`).join("");
}

async function editInvoice(no){
  const r=await api("getinvoice",{invoice:no});
  if(!r.success){setStatus(r.error||"Invoice could not be loaded.",true);return}
  const x=r.invoice;
  document.getElementById("edit_"+no).innerHTML=`
    <div class="editbox" style="margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0">
      <label>License Plate</label><input id="plate_${no}" value="${esc(x.plate)}">
      <label>Unit Number</label><input id="unit_${no}" value="${esc(x.unitNumber)}">
      <label>Mileage</label><input id="mileage_${no}" type="number" value="${esc(x.mileage)}">
      <label>Notes</label><textarea id="notes_${no}">${esc(x.notes)}</textarea>
      <div class="actions">
        <button class="btn green" onclick="saveInvoice('${no}')">SAVE CHANGES</button>
        ${x.paymentStatus==="PAID"
          ? `<button class="btn red" onclick="setInvoicePaid('${no}',false)">UNMARK PAID</button>`
          : `<button class="btn green" onclick="setInvoicePaid('${no}',true)">MARK PAID</button>`}
      </div>
    </div>`;
}

async function saveInvoice(no){
  setStatus("Saving invoice and regenerating PDF...");
  const r=await api("updateinvoice",{
    invoice:no,
    plate:document.getElementById("plate_"+no).value,
    unitNumber:document.getElementById("unit_"+no).value,
    mileage:document.getElementById("mileage_"+no).value,
    notes:document.getElementById("notes_"+no).value
  },60000);
  if(!r.success){setStatus(r.error||"Update failed.",true);return}
  setStatus("Invoice updated and PDF regenerated.");
  searchInvoices();
}

async function setInvoicePaid(no,paid){
  setStatus((paid?"Marking paid":"Reversing payment")+" and regenerating PDF...");
  const r=await api(paid?"markinvoicepaid":"unmarkinvoicepaid",{invoice:no},60000);
  if(!r.success){setStatus(r.error||"Payment update failed.",true);return}
  setStatus(paid?"Invoice marked PAID.":"Invoice payment reversed.");
  searchInvoices();
  loadBatches();
}

async function loadBatches(){
  const r=await api("listbatches",{});
  if(!r.success){setStatus(r.error||"Could not load batches.",true);return}
  document.getElementById("billingSummary").innerHTML=`
    <div><span class="small">Unbatched invoices</span><strong>${r.summary.unbatchedCount}</strong></div>
    <div><span class="small">Unbatched total</span><strong>${money(r.summary.unbatchedTotal)}</strong></div>`;
  const box=document.getElementById("batchResults");
  if(!r.batches.length){box.innerHTML='<div class="batch small">No billing batches yet.</div>';return}
  box.innerHTML=r.batches.map(b=>`
    <div class="batch">
      <div class="top"><div><strong>${esc(b.batchId)}</strong><div class="small">${esc(b.startDate)} – ${esc(b.endDate)}</div></div><span class="badge">${esc(b.status)}</span></div>
      <div class="batchgrid">
        <div><span>First Invoice</span><strong>${esc(b.firstInvoice)}</strong></div>
        <div><span>Last Invoice</span><strong>${esc(b.lastInvoice)}</strong></div>
        <div><span>Invoices</span><strong>${b.invoiceCount}</strong></div>
        <div><span>Total</span><strong>${money(b.total)}</strong></div>
        <div><span>Paid</span><strong>${b.paidCount}</strong></div>
        <div><span>Outstanding</span><strong>${money(b.outstanding)}</strong></div>
      </div>
      <div class="actions">
        ${b.status==="PAID"
          ? `<button class="btn red" onclick="setBatchPaid('${esc(b.batchId)}',false)">UNMARK BATCH PAID</button>`
          : `<button class="btn green" onclick="setBatchPaid('${esc(b.batchId)}',true)">MARK BATCH PAID</button>`}
      </div>
    </div>`).join("");
}

async function createBatch(){
  const s=document.getElementById("batchStart").value,e=document.getElementById("batchEnd").value;
  setStatus("Creating batch and refreshing PDFs...");
  const r=await api("createbatch",{startDate:s,endDate:e},120000);
  if(!r.success){setStatus(r.error||"Batch creation failed.",true);return}
  setStatus("Batch "+r.batchId+" created.");
  loadBatches();
}

async function setBatchPaid(id,paid){
  setStatus((paid?"Marking batch paid":"Reversing batch payment")+" and refreshing PDFs...");
  const r=await api(paid?"markbatchpaid":"unmarkbatchpaid",{batchId:id},120000);
  if(!r.success){setStatus(r.error||"Batch update failed.",true);return}
  setStatus(paid?"Batch marked PAID.":"Batch payment reversed.");
  loadBatches();
}
</script>
</body>
</html>
