<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>U-Save Oil Change</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 4px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 17px;
    }

    input[readonly] {
      background: #f8fafc;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #15803d;
      color: white;
    }

    .stop {
      background: #6b7280;
      color: white;
    }

    .manual {
      background: #e2e8f0;
      color: #1e293b;
    }

    .complete {
      background: #166534;
      color: white;
      margin-top: 22px;
      font-size: 19px;
    }

    .complete:disabled {
      opacity: .45;
    }

    #scanner {
      position: relative;
      width: 100%;
      height: 320px;
      margin-top: 18px;
      background: #111;
      overflow: hidden;
      border-radius: 12px;
      display: none;
    }

    #scanner video,
    #scanner canvas {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      left: 0;
      top: 0;
    }

    .scan-guide {
      position: absolute;
      z-index: 20;
      left: 5%;
      right: 5%;
      top: 38%;
      height: 80px;
      border: 3px solid #22c55e;
      border-radius: 7px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      z-index: 21;
      left: 7%;
      right: 7%;
      top: 50%;
      height: 2px;
      background: #ef4444;
      pointer-events: none;
    }

    #status {
      margin-top: 16px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
    }

    .vehicle-box {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 2px solid #16a34a;
    }

    .vehicle-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .vin-display {
      color: #475569;
      overflow-wrap: anywhere;
    }

    .price-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
    }

    .small {
      color: #64748b;
      font-size: 13px;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #15803d;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Oil Change</h1>

    <div class="subtitle">
      U-Save Service
    </div>


    <button
      id="startButton"
      class="start"
      type="button"
      onclick="startScanner()"
    >
      SCAN VIN
    </button>


    <div id="scanner">

      <div class="scan-guide"></div>

      <div class="scan-line"></div>

    </div>


    <button
      id="stopButton"
      class="stop"
      type="button"
      onclick="stopScanner()"
      style="display:none;"
    >
      STOP CAMERA
    </button>


    <div id="status">
      Ready to scan
    </div>


    <label for="vin">
      VIN
    </label>

    <input
      id="vin"
      maxlength="17"
      autocomplete="off"
      autocapitalize="characters"
      placeholder="Scan or enter VIN"
      oninput="vinChanged()"
    >


    <button
      class="manual"
      type="button"
      onclick="decodeVINFromInput()"
    >
      DECODE VIN
    </button>


    <div
      id="vehicleBox"
      class="vehicle-box"
    >

      <div
        id="vehicleName"
        class="vehicle-name"
      ></div>

      <div
        id="vinDisplay"
        class="vin-display"
      ></div>

    </div>


    <label for="mileage">
      Mileage
    </label>

    <input
      id="mileage"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="Enter current mileage"
      oninput="updateCompleteButton()"
    >


    <div class="price-box">

      <div>
        <strong>Oil & Filter Change</strong>
        <div class="small">
          Contract service price
        </div>
      </div>

      <div class="price">
        $65.00
      </div>

    </div>


    <button
      id="completeButton"
      class="complete"
      type="button"
      onclick="completeService()"
      disabled
    >
      COMPLETE OIL CHANGE
    </button>

  </div>

</div>


<!-- Hidden form used to send data to Apps Script -->
<form
  id="serviceForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbxe8iGhBAEjjLeyWEj_ws2-oEAlol9qmylOaL_WbLFRC3lr1iNsNiQ21JOPzM90106y/exec"
  style="display:none;"
>

  <input
    type="hidden"
    name="payload"
    id="payload"
  >

</form>


<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>


<script>

let scannerStarted = false;

let lastCandidate = "";

let candidateCount = 0;

let vehicleData = null;



/*
 * START CAMERA
 */
function startScanner() {

  if (scannerStarted) {
    return;
  }


  document.getElementById(
    "scanner"
  ).style.display = "block";


  document.getElementById(
    "stopButton"
  ).style.display = "block";


  setStatus(
    "Starting camera..."
  );


  Quagga.init({

    inputStream: {

      name: "Live",

      type: "LiveStream",

      target:
        document.querySelector(
          "#scanner"
        ),

      constraints: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      area: {

        top: "25%",

        right: "5%",

        left: "5%",

        bottom: "25%"

      }

    },


    locator: {

      patchSize: "medium",

      halfSample: true

    },


    numOfWorkers:
      navigator.hardwareConcurrency
        ? Math.min(
            navigator.hardwareConcurrency,
            4
          )
        : 2,


    frequency: 10,


    decoder: {

      readers: [

        "code_128_reader",

        "code_39_reader",

        "code_93_reader",

        "codabar_reader"

      ]

    },


    locate: true


  },

  function(error) {

    if (error) {

      console.error(error);

      setStatus(
        "Camera error: " +
        (
          error.message ||
          error.name ||
          error
        ),
        true
      );

      return;

    }


    scannerStarted = true;

    Quagga.start();


    setStatus(
      "Point camera at VIN barcode"
    );

  });

}



/*
 * BARCODE DETECTION
 */
Quagga.onDetected(
  function(result) {

    if (
      !result ||
      !result.codeResult ||
      !result.codeResult.code
    ) {
      return;
    }


    let raw =
      String(
        result.codeResult.code
      )
      .toUpperCase()
      .trim();


    const matches =
      raw.match(
        /[A-HJ-NPR-Z0-9]{17}/g
      );


    if (
      !matches ||
      matches.length === 0
    ) {
      return;
    }


    const vin =
      matches[0];


    if (
      vin === lastCandidate
    ) {

      candidateCount++;

    }

    else {

      lastCandidate = vin;

      candidateCount = 1;

    }


    setStatus(
      "Reading VIN... " +
      candidateCount +
      "/2"
    );


    if (
      candidateCount >= 2
    ) {

      document.getElementById(
        "vin"
      ).value = vin;


      stopScanner(false);


      decodeVIN(vin);

    }

  }
);



/*
 * STOP CAMERA
 */
function stopScanner(
  changeStatus = true
) {

  if (scannerStarted) {

    try {
      Quagga.stop();
    }

    catch (error) {
      console.log(error);
    }

  }


  scannerStarted = false;

  lastCandidate = "";

  candidateCount = 0;


  document.getElementById(
    "scanner"
  ).style.display = "none";


  document.getElementById(
    "stopButton"
  ).style.display = "none";


  if (changeStatus) {

    setStatus(
      "Camera stopped"
    );

  }

}



/*
 * MANUAL VIN ENTRY
 */
function vinChanged() {

  const input =
    document.getElementById(
      "vin"
    );


  input.value =
    input.value
      .toUpperCase()
      .replace(
        /[^A-HJ-NPR-Z0-9]/g,
        ""
      )
      .slice(
        0,
        17
      );


  vehicleData = null;


  document.getElementById(
    "vehicleBox"
  ).style.display = "none";


  updateCompleteButton();

}



function decodeVINFromInput() {

  const vin =
    document.getElementById(
      "vin"
    ).value
      .trim()
      .toUpperCase();


  decodeVIN(vin);

}



/*
 * NHTSA VIN DECODER
 */
async function decodeVIN(vin) {

  if (
    !/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)
  ) {

    setStatus(
      "VIN must contain exactly 17 valid characters.",
      true
    );

    return;

  }


  setStatus(
    "Decoding VIN..."
  );


  try {

    const url =
      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/" +
      encodeURIComponent(vin) +
      "?format=json";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "VIN decoder unavailable"
      );

    }


    const data =
      await response.json();


    if (
      !data.Results ||
      !data.Results.length
    ) {

      throw new Error(
        "No vehicle information returned"
      );

    }


    const result =
      data.Results[0];


    if (
      !result.ModelYear ||
      !result.Make ||
      !result.Model
    ) {

      throw new Error(
        "Vehicle could not be identified"
      );

    }


    vehicleData = {

      vin: vin,

      year:
        result.ModelYear,

      make:
        result.Make,

      model:
        result.Model

    };


    document.getElementById(
      "vehicleName"
    ).textContent =
      vehicleData.year +
      " " +
      vehicleData.make +
      " " +
      vehicleData.model;


    document.getElementById(
      "vinDisplay"
    ).textContent =
      vehicleData.vin;


    document.getElementById(
      "vehicleBox"
    ).style.display =
      "block";


    setStatus(
      "Vehicle identified",
      false,
      true
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100, 50, 100]
      );

    }


    document.getElementById(
      "mileage"
    ).focus();


    updateCompleteButton();

  }

  catch (error) {

    console.error(error);

    vehicleData = null;


    setStatus(
      "VIN decode failed: " +
      error.message,
      true
    );


    updateCompleteButton();

  }

}



/*
 * ENABLE COMPLETE BUTTON
 */
function updateCompleteButton() {

  const mileage =
    Number(
      document.getElementById(
        "mileage"
      ).value
    );


  document.getElementById(
    "completeButton"
  ).disabled =
    !vehicleData ||
    !Number.isFinite(mileage) ||
    mileage <= 0;

}



/*
 * COMPLETE SERVICE
 */
function completeService() {

  if (!vehicleData) {

    setStatus(
      "Scan or decode a VIN first.",
      true
    );

    return;

  }


  const mileage =
    Number(
      document.getElementById(
        "mileage"
      ).value
    );


  if (
    !Number.isFinite(mileage) ||
    mileage <= 0
  ) {

    setStatus(
      "Enter a valid mileage.",
      true
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "SAVING...";


  const payload = {

    vin:
      vehicleData.vin,

    year:
      vehicleData.year,

    make:
      vehicleData.make,

    model:
      vehicleData.model,

    mileage:
      mileage

  };


  /*
   * Apps Script expects JSON.
   *
   * We put JSON into the hidden form.
   */
  document.getElementById(
    "payload"
  ).value =
    JSON.stringify(payload);


  document.getElementById(
    "serviceForm"
  ).submit();

}



/*
 * STATUS MESSAGE
 */
function setStatus(
  message,
  isError = false,
  isSuccess = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className = "";


  if (isError) {

    status.classList.add(
      "error"
    );

  }


  if (isSuccess) {

    status.classList.add(
      "success"
    );

  }

}

</script>

</body>

</html>
